[package]
name = "lilia"
version = "0.1.0"
description = "Lilia Token-2022 transfer hook enforcing signed authorization permits"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lilia"

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.2", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "solana-v3"] }
spl-discriminator = "0.5.1"
spl-tlv-account-resolution = "0.11.4"
spl-transfer-hook-interface = "2.1.0"
solana-instruction = "3.0.0"
solana-instructions-sysvar = "3.0.0"
solana-sdk-ids = "3.0.0"
