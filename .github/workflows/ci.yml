name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install (single root lockfile for the whole monorepo)
        run: bun install --frozen-lockfile
      - name: Build all workspaces
        run: bunx turbo run build

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck all workspaces
        run: bunx turbo run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint all workspaces
        run: bunx turbo run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install
        run: bun install --frozen-lockfile
      - name: TypeScript tests (Solana package)
        run: bun test packages/solana
      - name: Rust tests (Anchor program)
        uses: dtolnay/rust-toolchain@stable
      - name: Install system deps for Rust
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Cargo tests
        run: cargo test -p lilia
