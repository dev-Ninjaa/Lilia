
name: Publish MCP Package

on:
  push:
    tags:
      - 'mcp-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.1)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/mcp-v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update package version
        working-directory: apps/mcp
        run: npm pkg set version="${{ steps.version.outputs.VERSION }}"

      - name: Build MCP package
        working-directory: apps/mcp
        run: npm run build

      - name: Run typecheck
        working-directory: apps/mcp
        run: npm run typecheck --if-present

      - name: Publish to npm
        working-directory: apps/mcp
        run: npm publish --access public --provenance

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@dev-ninjaa'
          package-manager-cache: false

      - name: Publish to GitHub Packages
        working-directory: apps/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp package.json package.json.backup

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.name = '@dev-ninjaa/lilia-mcp';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

          npm publish --registry=https://npm.pkg.github.com

          mv package.json.backup package.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mcp-v${{ steps.version.outputs.VERSION }}
          name: MCP v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          body: |
            ## lilia-mcp v${{ steps.version.outputs.VERSION }}

            ### Installation

            ```bash
            npm install -g lilia-mcp@${{ steps.version.outputs.VERSION }}
            ```

            ### Setup

            ```bash
            npx lilia-mcp-setup
            ```

            ### Changes

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/apps/mcp/CHANGELOG.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
